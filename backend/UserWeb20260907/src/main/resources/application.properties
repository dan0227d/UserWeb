spring.application.name=UserWeb20260907
# 伺服器埠號（預設 8080）
server.port=8080
# session保留與否
server.servlet.session.persistent=false

# MySQL 資料庫連線設定（請依據你的環境修改密碼）
spring.datasource.url=jdbc:mysql://localhost:3306/company
spring.datasource.username=root
spring.datasource.password=1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# 最多 30 條 DB Connection
spring.datasource.hikari.maximum-pool-size=30
# 借出超過 20 秒還沒歸還 → Leak 警告
spring.datasource.hikari.leak-detection-threshold=20000
# 拿不到 Connection 時最多等 30 秒
spring.datasource.hikari.connection-timeout=30000

# JPA / Hibernate 設定
# update create-drop validate
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
#排序PK放第一，後續用字母循序
spring.jpa.properties.hibernate.column_ordering_strategy=legacy


# MyBatis 會掃描您指定的包以及其子包下的所有 Java 類別
mybatis.type-aliases-package=com.example.demo.model

# 駝峰命名自動對應功能開啟 (ex: user_name -> userName)
mybatis.configuration.map-underscore-to-camel-case=true

# 指定 Mapper XML 檔案位置
mybatis.mapper-locations=classpath:mapper/**/*.xml

# 設定自動對應的行為等級
mybatis.configuration.auto-mapping-behavior=FULL

# Keys.hmacShaKeyFor(secretKeyStr.getBytes())需要256位元
jwt.secret-key=1234567890abcdefghij1234567890ab
jwt.private-
jwt.public-
jwt.access-valid-seconds=60
jwt.refresh-valid-seconds=600

